name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**.md'
      - 'docs/**'
      - LICENSE
  pull_request:
    paths-ignore: *docs

# PR 只跑最新一次；main 按提交分组，每个提交都完整跑完
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
            run: npm run lint && npm run format:check && npm run i18n:check
          - name: test 1/3
            run: npm test
            shard: --test-shard=1/3
          - name: test 2/3
            run: npm test
            shard: --test-shard=2/3
          - name: test 3/3
            run: npm test
            shard: --test-shard=3/3
          - name: build
            run: npm run build
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # 四个 job 共用：命中时不用再跑 npm ci，比 setup-node 只缓存下载包省 10 秒以上
      - id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: ${{ matrix.run }}
        env:
          NODE_OPTIONS: ${{ matrix.shard }}
